name: Build & Lint

on:
  push:
    # 独立验证分支可以实跑 push CI，方便在合入 master 前检查变更。
    branches: [ "master", "codex/ci-parallel" ]
    tags: [ "v*" ]
    # docs-only 推送跳过（文档不触达构建/测试；tag 推送不受 paths 过滤影响）
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ "master" ]

# 同一 ref 连推时取消仍在跑的旧运行（2026-10-01 加）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows 分三片，macOS 分两片以减少等待运行器的概率。
  # Ubuntu 用单个作业运行全量测试，三平台均保留完整覆盖。
  test:
    name: Test (${{ matrix.os }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 保留其余系统和分片的结果，便于定位失败。
      fail-fast: false
      matrix:
        os: [windows-latest]
        shard: ['1/3', '2/3', '3/3']
        include:
          - os: ubuntu-latest
          - os: macos-latest
            shard: '1/2'
          - os: macos-latest
            shard: '2/2'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      - name: Test (Vitest)
        run: pnpm run test ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}

  static:
    name: Lint and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      - name: Lint (ESLint)
        run: pnpm run lint
      - name: Boundary ratchet
        run: pnpm run check:boundaries
      - name: Core type check (without DOM or Electron)
        run: pnpm run typecheck:core
      - name: Type check (TypeScript)
        run: pnpm run typecheck

  contracts:
    name: Storage contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      # 单独运行真实文件存储契约，便于定位问题。
      - name: Contracts (Vitest)
        run: pnpm run test:contracts

  build:
    name: Build and smoke check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-ci
    - name: Build (Vite)
      run: pnpm run build:vite

    - name: Smoke check — verify build output
      shell: bash
      run: |
        # 1. preload 文件存在且格式正确
        PRELOAD=$(ls dist-electron/preload.* 2>/dev/null)
        if [ -z "$PRELOAD" ]; then echo "❌ preload 缺失"; exit 1; fi
        EXT="${PRELOAD##*.}"
        if [ "$EXT" = "mjs" ] && grep -q 'require(' "$PRELOAD" 2>/dev/null; then
          echo "❌ preload.mjs 包含 require() — 将在 ESM 模式下崩溃"
          exit 1
        fi
        echo "   preload: $PRELOAD"

        # 2. 主进程入口存在
        if [ ! -f "dist-electron/main.js" ]; then echo "❌ main.js 缺失"; exit 1; fi
        echo "   main: dist-electron/main.js"

        # 3. 前端入口存在
        if [ ! -f "dist/index.html" ]; then echo "❌ dist/index.html 缺失"; exit 1; fi
        echo "   renderer: dist/index.html"

        # 4. 运行构建契约检查
        node scripts/verify-build-contract.cjs

        echo "✅ CI smoke check 通过"

  # ===== Release 构建（仅 tag push 触发，Ubuntu 环境） =====
  # 本 job 只产出 GitHub Actions artifact（NovelForge-linux-<tag>），**不写入 GitHub Release 资产**——
  # 正式发布走本地 Windows 构建 + gh release create（见 novelforge-release）。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, static, contracts, build]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Enable pnpm (via corepack)
      run: corepack enable pnpm

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Electron app (Linux)
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # 走 npmmirror 下载 electron-builder 二进制（appimage/mksquashfs 等），
        # 避免 CI 从 GitHub 直连下载超时/限流导致 AppImage 打包失败
        ELECTRON_BUILDER_BINARIES_MIRROR: 'https://npmmirror.com/mirrors/electron-builder-binaries/'
      run: pnpm run build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NovelForge-linux-${{ github.ref_name }}
        path: release/*/
