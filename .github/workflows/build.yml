name: Build & Lint

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
    # docs-only 推送跳过（文档不触达构建/测试；tag 推送不受 paths 过滤影响）
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ "master" ]

# 同一 ref 连推时取消仍在跑的旧运行（2026-10-01 加）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== 质量检查（2026-10-01 起分职制：ubuntu 全查 + 全平台 Test） =====
  # 分职依据：lint/typecheck/build 是语义检查，产出基本与平台无关（大小写敏感度上 ubuntu 反而最严格）；
  # Test 是平台相关行为的探针（历史事故：electron 二进制缺失、path.basename 跨平台——均在 POSIX 侧抓到），
  # 故 Test 保持三平台矩阵，其余步骤只在 ubuntu 跑；wall 从 ~3m32s 收敛到 ubuntu 侧时长。
  check:
    runs-on: ${{ matrix.os }}

    strategy:
      # 一个平台失败不取消其余平台。默认 fail-fast 会让先挂的平台 cancel 掉另外两个，
      # 制造「只有某平台失败」的假象并掩盖全貌（2026-09-10 前的 CI 事故即如此）。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Enable pnpm (via corepack)
      run: corepack enable pnpm

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      run: pnpm install --frozen-lockfile

    # ---- 语义检查（平台无关；ubuntu 单平台） ----
    - name: Lint (ESLint)
      if: matrix.os == 'ubuntu-latest'
      run: pnpm run lint

    # ---- 行为检查（平台相关；三平台矩阵） ----
    - name: Test (Vitest)
      run: pnpm run test

    - name: Type check (TypeScript)
      if: matrix.os == 'ubuntu-latest'
      run: pnpm tsc --noEmit

    - name: Build (Vite)
      if: matrix.os == 'ubuntu-latest'
      run: pnpm vite build

    - name: Smoke check — verify build output
      if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
      shell: bash
      run: |
        # 1. preload 文件存在且格式正确
        PRELOAD=$(ls dist-electron/preload.* 2>/dev/null)
        if [ -z "$PRELOAD" ]; then echo "❌ preload 缺失"; exit 1; fi
        EXT="${PRELOAD##*.}"
        if [ "$EXT" = "mjs" ] && grep -q 'require(' "$PRELOAD" 2>/dev/null; then
          echo "❌ preload.mjs 包含 require() — 将在 ESM 模式下崩溃"
          exit 1
        fi
        echo "   preload: $PRELOAD"

        # 2. 主进程入口存在
        if [ ! -f "dist-electron/main.js" ]; then echo "❌ main.js 缺失"; exit 1; fi
        echo "   main: dist-electron/main.js"

        # 3. 前端入口存在
        if [ ! -f "dist/index.html" ]; then echo "❌ dist/index.html 缺失"; exit 1; fi
        echo "   renderer: dist/index.html"

        # 4. 运行构建契约检查
        node scripts/verify-build-contract.cjs

        echo "✅ CI smoke check 通过"

  # ===== Release 构建（仅 tag push 触发，Ubuntu 环境） =====
  # 本 job 只产出 GitHub Actions artifact（NovelForge-linux-<tag>），**不写入 GitHub Release 资产**——
  # 正式发布走本地 Windows 构建 + gh release create（见 novelforge-release）。
  # 因 needs: check，check 恒红期间（2026-08-15~09-10）它从未真正运行过。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Enable pnpm (via corepack)
      run: corepack enable pnpm

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Electron app (Linux)
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      run: pnpm run build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NovelForge-linux-${{ github.ref_name }}
        path: release/*/
