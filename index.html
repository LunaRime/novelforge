<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovelForge — AI 小说创作 IDE</title>
    <!-- file:// 的生产 CSP。启动页脚本与应用入口都是本地资源。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' %VITE_CSP_SCRIPT%; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.openai.com https://*.anthropic.com https://*.googleapis.com https://*.deepseek.com https://*.bigmodel.cn http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; media-src 'self'" />
    <link rel="preload" href="/fonts/Inter-VariableFont_opsz,wght.ttf" as="font" type="font/ttf" crossorigin>
    <script src="/theme-init.js"></script>
    <script src="/startup-timer.js"></script>
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/Inter-VariableFont_opsz,wght.ttf') format('truetype');
        font-weight: 100 900;
        font-display: swap;
      }

      /* 首帧早于应用样式加载，自带与启动稿纸配套的主题令牌。 */
      [data-startup] {
        --startup-canvas: #fffdf9;
        --startup-sheet: #f8f3eb;
        --startup-ink: #2c2520;
        --startup-muted: #5b5349;
        --startup-line: #d9d2c5;
        --startup-accent: #4d6650;
        --startup-error: #a33c44;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 3rem clamp(1rem, 5vw, 3rem);
        box-sizing: border-box;
        background: var(--startup-canvas);
        color: var(--startup-ink);
        font: 0.9375rem/1.5 Inter, system-ui, sans-serif;
      }
      :is(.dark, .galaxy) [data-startup] {
        --startup-canvas: #08080a;
        --startup-sheet: #1c1f20;
        --startup-ink: #e8e8ea;
        --startup-muted: #b9b8b4;
        --startup-line: #424641;
        --startup-accent: #91aa7e;
        --startup-error: #f2999f;
      }
      .startup-window-drag {
        position: absolute;
        inset: 0 0 auto;
        height: 32px;
        app-region: drag;
        -webkit-app-region: drag;
      }
      .startup-paper {
        display: grid;
        justify-items: center;
        width: min(100%, 25rem);
        box-sizing: border-box;
        padding: clamp(1.5rem, 5vw, 2.75rem) clamp(1rem, 4vw, 2.25rem);
        border: 1px solid var(--startup-line);
        border-radius: 0.875rem;
        background: var(--startup-sheet);
        box-shadow: 0 5px 0 -1px var(--startup-sheet), 0 6px 0 -1px var(--startup-line);
        text-align: center;
      }
      .startup-mark { display: block; inline-size: 4.5rem; block-size: 4.5rem; }
      .startup-paper h1 {
        margin: 1rem 0 0;
        font-size: clamp(1.65rem, 4vw, 2.125rem);
        font-weight: 650;
        line-height: 1.15;
      }
      .startup-message { margin-block-start: 1rem; }
      .startup-message p { margin: 0; }
      #startup-state { font-weight: 550; }
      #startup-detail { margin-block-start: .25rem; color: var(--startup-muted); }
      [data-startup="failed"] #startup-state { color: var(--startup-error); }
      #startup-progress {
        width: min(100%, 9rem);
        height: 3px;
        margin-block-start: 1.25rem;
        overflow: hidden;
        border-radius: 999px;
        background: var(--startup-line);
      }
      #startup-progress::after {
        content: '';
        display: block;
        width: 34%;
        height: 100%;
        border-radius: inherit;
        background: var(--startup-accent);
        animation: startup-travel 1.8s ease-in-out infinite alternate;
      }
      @keyframes startup-travel { to { transform: translateX(194%); } }
      @media (prefers-reduced-motion: reduce) {
        #startup-progress::after { transform: translateX(97%); animation: none; }
      }
      #startup-retry {
        min-height: 32px;
        margin-block-start: 1rem;
        padding: .25rem .75rem;
        border: 1px solid var(--startup-accent);
        border-radius: .375rem;
        background: var(--startup-sheet);
        color: var(--startup-ink);
        font: inherit;
        cursor: pointer;
      }
      #startup-retry:hover { background: var(--startup-canvas); }
      #startup-retry:focus-visible { outline: 2px solid var(--startup-accent); outline-offset: 3px; }
      [data-startup] [hidden] { display: none; }
    </style>
  </head>
  <body style="margin: 0;">
    <div id="root">
      <main data-startup="loading">
        <div class="startup-window-drag" aria-hidden="true"></div>
        <div class="startup-paper">
          <img class="startup-mark" src="./build/icon.png" width="72" height="72" alt="" />
          <h1>NovelForge</h1>
          <div class="startup-message" role="status" aria-atomic="true">
            <p id="startup-state">正在打开工作台…</p>
            <p id="startup-detail" hidden></p>
          </div>
          <div id="startup-progress" aria-hidden="true"></div>
          <button id="startup-retry" type="button" hidden>重试</button>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
