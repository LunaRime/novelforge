<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovelForge — AI 小说创作 IDE</title>
    <!-- P0-1：生产环境 CSP（file:// 不经过 webRequest，必须走 meta）。
         %VITE_CSP_SCRIPT% 由 vite.config 按模式替换：dev='unsafe-inline'（react-refresh preamble），
         生产='self'（内联脚本已外移至 public/theme-init.js / startup-timer.js） -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' %VITE_CSP_SCRIPT%; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.openai.com https://*.anthropic.com https://*.googleapis.com https://*.deepseek.com https://*.bigmodel.cn http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; media-src 'self'" />
    <!-- 预加载 UI 核心字体 Inter（其他字体按需加载） -->
    <link rel="preload" href="/fonts/Inter-VariableFont_opsz,wght.ttf" as="font" type="font/ttf" crossorigin>
    <!-- 渲染前同步初始化（主题 + 启动页 i18n）——原内联脚本外移，满足生产 CSP script-src 'self' -->
    <script src="/theme-init.js"></script>
  </head>
  <body style="margin: 0;">
    <div id="root">
      <style>
        .vela-initial-loader {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: 100vh;
          width: 100vw;
          background-color: var(--loader-bg, #0A1628);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          user-select: none;
        }
        
        .vela-core-container {
          position: relative;
          width: 80px;
          height: 80px;
          display: flex;
          justify-content: center;
          align-items: center;
          margin-bottom: 24px;
        }

        .vela-ring {
          position: absolute;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          border: 2px solid transparent;
          border-top-color: rgba(126, 200, 227, 0.8);
          border-bottom-color: rgba(155, 142, 200, 0.8);
          animation: vela-spin 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .vela-ring-inner {
          position: absolute;
          width: 65%;
          height: 65%;
          border-radius: 50%;
          border: 2px solid transparent;
          border-left-color: rgba(126, 200, 227, 0.8);
          border-right-color: rgba(201, 167, 108, 0.8);
          animation: vela-spin-reverse 2.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .vela-core {
          width: 14px;
          height: 14px;
          background: linear-gradient(135deg, #7EC8E3, #9B8EC8);
          border-radius: 50%;
          box-shadow: 0 0 20px rgba(126, 200, 227, 0.6), 0 0 40px rgba(155, 142, 200, 0.4);
          animation: vela-pulse 2s ease-in-out infinite;
        }

        .vela-text {
          font-size: 13px;
          font-weight: 500;
          letter-spacing: 4px;
          text-transform: uppercase;
          background: linear-gradient(90deg, #7EC8E3, #9B8EC8, #C9A76C, #7EC8E3);
          background-size: 200% auto;
          color: transparent;
          -webkit-background-clip: text;
          background-clip: text;
          animation: vela-text-shine 3s linear infinite;
        }

        @keyframes vela-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        @keyframes vela-spin-reverse {
          0% { transform: rotate(360deg); }
          100% { transform: rotate(0deg); }
        }

        @keyframes vela-pulse {
          0%, 100% { transform: scale(0.8); opacity: 0.8; box-shadow: 0 0 15px rgba(126, 200, 227, 0.5); }
          50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 30px rgba(126, 200, 227, 0.9), 0 0 50px rgba(155, 142, 200, 0.6); }
        }

        @keyframes vela-text-shine {
          to { background-position: 200% center; }
        }
      </style>
      <div class="vela-initial-loader">
        <div class="vela-core-container">
          <div class="vela-ring"></div>
          <div class="vela-ring-inner"></div>
          <div class="vela-core"></div>
        </div>
        <div id="vela-splash-text" class="vela-text">NovelForge 初始化中</div>
        <div id="vela-startup-timer" style="margin-top:12px;font-size:11px;color:rgba(255,255,255,0.35);font-family:monospace;letter-spacing:1px;"></div>
      </div>
    </div>
    <!-- 启动计时：记录 HTML 解析完成时间，并在加载页实时显示耗时（原内联脚本外移，满足 CSP） -->
    <script src="/startup-timer.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
