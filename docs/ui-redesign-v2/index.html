<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="NovelForge UI Redesign v2 · Forge Console — a feature-complete desktop-window prototype with design tokens, palettes, light/dark modes and a functional coverage matrix.">
  <title>NovelForge · Forge Console v2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%230b1117'/%3E%3Cpath d='M10 30V10h20M10 20h15M25 20v10' stroke='%236f9bff' stroke-width='2.4' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./prototype.css">
  <link rel="stylesheet" href="./components.css">
  <script src="./data.js" defer></script>
  <script src="./ui.js" defer></script>
  <script src="./views.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <!-- The surrounding review stage is documentation, not part of the app. -->
  <div class="review-stage" id="review-stage">
    <header class="showcase-header">
      <div class="showcase-heading">
        <div class="showcase-kicker" id="showcase-kicker"></div>
        <h1 id="showcase-title"></h1>
        <p id="showcase-subtitle"></p>
      </div>
      <div class="showcase-controls" id="showcase-controls"></div>
    </header>

    <section class="brief" id="brief" aria-labelledby="brief-title">
      <h2 id="brief-title"></h2>
      <div class="brief-grid" id="brief-grid"></div>
    </section>

    <section class="program-window" id="program-window"
             data-mode="dark" data-palette="cobalt" data-density="normal" data-writing-size="17"
             aria-label="NovelForge Forge Console prototype">
      <header class="window-titlebar" id="window-titlebar"></header>
      <div class="window-content" id="window-content">
        <div class="window-wallpaper" aria-hidden="true"></div>
        <div class="window-grid" aria-hidden="true"></div>
        <div id="app"></div>
        <aside class="appearance-panel" id="appearance-panel" aria-labelledby="appearance-title" hidden></aside>
        <div id="toast" role="status" aria-live="polite"></div>
      </div>
      <div class="window-placeholder" id="window-placeholder" hidden></div>
      <dialog id="modal" aria-labelledby="modal-title"></dialog>
    </section>

    <section class="feature-map" id="feature-map" aria-labelledby="feature-map-title">
      <div class="feature-map-head">
        <div>
          <div class="showcase-kicker" id="feature-map-kicker"></div>
          <h2 id="feature-map-title"></h2>
          <p id="feature-map-desc"></p>
        </div>
        <div class="feature-legend" id="feature-legend"></div>
      </div>
      <div class="feature-map-grid" id="feature-map-grid"></div>
      <div class="feature-backend" id="feature-backend"></div>
    </section>

    <footer class="showcase-footer" id="showcase-footer"></footer>
  </div>
  <noscript>请启用 JavaScript 以查看交互原型。 / Enable JavaScript to view the interactive prototype. / Включите JavaScript для просмотра прототипа.</noscript>
</body>
</html>
