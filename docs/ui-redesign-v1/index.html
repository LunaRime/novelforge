<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="NovelForge Editorial Studio — desktop window preview, color palettes, light/dark mode and local image backgrounds.">
  <title>NovelForge · Editorial Studio v1.1</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23405c47'/%3E%3Cpath d='M11 29V11l18 18V11M11 20h18' stroke='%23fffefa' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./prototype.css">
  <script src="./prototype.js" defer></script>
</head>
<body>
  <!-- The surrounding review stage is not part of the desktop application. -->
  <div class="review-stage" id="review-stage">
    <header class="showcase-header" id="showcase-header"></header>
    <section class="program-window" id="program-window" data-mode="light" data-palette="moss" aria-label="NovelForge">
      <header class="window-titlebar" id="window-titlebar"></header>
      <div class="window-content" id="window-content">
        <div class="window-wallpaper" id="window-wallpaper" aria-hidden="true"></div>
        <div id="app"></div>
        <aside class="appearance-panel" id="appearance-panel" aria-labelledby="appearance-title" hidden></aside>
      </div>
      <div class="window-placeholder" id="window-placeholder" hidden></div>
      <dialog id="modal" aria-labelledby="modal-title"></dialog>
      <div id="toast" role="status" aria-live="polite"></div>
    </section>
    <footer class="showcase-footer" id="showcase-footer"></footer>
  </div>
  <noscript>请启用 JavaScript 以查看交互原型。 / Enable JavaScript to view this prototype. / Включите JavaScript для просмотра прототипа.</noscript>
</body>
</html>
